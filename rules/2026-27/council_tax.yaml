  ctr_family_premium:
    label: Council Tax Reduction family premium (pensioner scheme)
    unit: gbp_per_week
    value: 20.22
    source: uksi-2026-27
    legal: SI 2012/2885 Sch 2 para 3(a), as amended by SI 2026/27
  ctr_taper:
    label: Council Tax Reduction withdrawn per £1 of income above the applicable amount
    unit: rate
    value: 0.2
    source: uksi-2026-27
    legal: SI 2012/2885 Schedule 1 (pensioners); Scotland's and Wales's schemes use 20% too
  ctr_capital_limit:
    label: Savings above which there is no Council Tax Reduction
    unit: gbp
    value: 16000
    source: uksi-2026-27
    legal: SI 2012/2885 Schedule 1
    note: Pensioners on the guarantee credit of Pension Credit have no limit; Pension Credit isn't modelled, so the limit applies to everyone.
  ctr_pensioner_take_up:
    label: Share of entitled pensioner households that claim Council Tax Reduction
    unit: rate
    value: 1
    source: ours-ctr-calibration
    note: Calibrated to MHCLG's spending on pensioners in England (£1,816m in 2025-26, grown with Band D to £1,905m), which needs every entitled pensioner to claim (we get £1,898m). Real take-up is surely lower, so our pensioners are probably more often entitled than real ones; see POPULATION.md.
  ctr_england_working_age_max:
    label: Most of the bill England's stand-in working-age scheme will pay
    unit: rate
    value: 0.75
    source: ours-ctr-calibration
    note: Many English councils make working-age households pay at least part of the bill. Calibrated to MHCLG's spending on working-age people in England (£2,506m in 2025-26, grown with Band D to £2,629m).
