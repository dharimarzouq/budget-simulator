year: 2026-27
area: council_tax
label: Council tax, Northern Ireland's domestic rates, and Council Tax Reduction
limits:
  - Council tax is set by each council; we don't know which council a household is in, so every home pays its region's average Band D (England) or its nation's (Wales, Scotland), including police, fire and parish or community council precepts. Scotland's excludes water and sewerage charges, which aren't council tax.
  - Discounts other than the single person discount (students, carers, disabled band reduction and so on) are left out.
  - Northern Ireland's district rate is the average of its 11 councils' rates, not weighted by homes.
  - Council Tax Reduction is one simplified scheme, worked out on the liable family's own income only, ignoring other adults in the home (non-dependant deductions). Pensioners everywhere follow England's national pensioner scheme. Working-age schemes differ by council in England; one stand-in scheme is calibrated to England's total spending. Scotland, Wales and Northern Ireland (rate rebate) use the same rules with nothing held back.
  - Not every household entitled to Council Tax Reduction claims it. Each household has a fixed draw; pensioners claim if the draw is under the take-up rate, and working-age families claim if they claim Universal Credit.
  - Working-age families' earnings up to Universal Credit's work allowance are ignored, standing in for schemes' own earnings disregards.
  - Pension Credit isn't modelled. Pensioners whose income is under the applicable amount are treated as getting its guarantee credit, which lifts the savings limit, as the scheme does.
