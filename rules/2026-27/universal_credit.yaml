year: 2026-27
area: universal_credit
label: Universal Credit
limits:
  - Monthly amounts for assessment periods starting on or after 6 April 2026.
  - Housing costs are taken as the rent entered, with no Local Housing Allowance cap by area yet.
  - Leaves out transitional protection, the limited capability for work amount (closed to new claims since 2017) and sanctions and deductions.
  - Benefit cap - counts Universal Credit and Child Benefit as the capped benefits. Treats a disabled child as getting Disability Living Allowance or similar, which exempts the household. Leaves out the 9-month grace period after leaving work.
