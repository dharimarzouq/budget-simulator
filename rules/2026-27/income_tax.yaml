year: 2026-27
area: income_tax
label: Income tax
limits:
  - Income is taxed in the legal order - non-savings income (earnings, profits, pensions, property) first, then savings interest, then dividends. Savings and dividends use UK rates and bands everywhere, including Scotland.
  - Property income is taxed as non-savings income in 2026-27. Separate property rates (22/42/47%) start in April 2027.
  - For Scottish taxpayers, the personal savings allowance is worked out on UK bands. That's a simplification to check.
  - Marriage Allowance treats every couple as married or in a civil partnership; in the population, who claims it (which leaves out cohabiting couples) is part of the take-up.
  - Other deductions (losses, qualifying interest) and tax reductions (EIS, SEIS and VCT relief, relief for tax paid abroad and similar) are taken as amounts given for each person, not worked out from their own rules.
  - Ignores the blind person's allowance, finance cost relief for landlords and reliefs other than those stated.
parameters:
  personal_allowance:
    label: Personal allowance
    unit: gbp_per_year
    value: 12570
    source: hmrc-employer-rates-2026-27
    legal: Income Tax Act 2007 s35

  personal_allowance_taper_threshold:
    label: Income above which the personal allowance is withdrawn
    unit: gbp_per_year
    value: 100000
    source: hmrc-employer-rates-2026-27
    legal: Income Tax Act 2007 s35(2)
    note: Measured on adjusted net income. The allowance is fully gone at £125,140.

  personal_allowance_taper_rate:
    label: Personal allowance lost per £1 of income above the threshold
    unit: rate
    value: 0.5
    source: hmrc-employer-rates-2026-27
    legal: Income Tax Act 2007 s35(2) (reduced by half the excess)

  marriage_allowance_transfer:
    label: Marriage Allowance, personal allowance a spouse or civil partner can transfer
    unit: gbp_per_year
    value: 1260
    source: govuk-marriage-allowance
    legal: Income Tax Act 2007 ss55A to 55E (10% of the personal allowance, rounded up to the next £10)
    note: The partner who transfers it must have income below the personal allowance; the partner who receives it must pay tax at no more than the basic rate (the intermediate rate in Scotland). Their tax falls by the transfer at the basic rate, up to £252 a year. For Scottish taxpayers that's the Scottish basic rate, also 20%, not the starter rate (Income Tax Act 2007 s55B(3)).

  bands_ruk:
    label: Income tax bands, England and Northern Ireland
    unit: gbp_per_year
    bands:
      - { threshold: 0, rate: 0.20 }
      - { threshold: 37700, rate: 0.40 }
      - { threshold: 125140, rate: 0.45 }
    source: hmrc-employer-rates-2026-27
    legal: Income Tax Act 2007 s6 and s10; rates set by the annual Finance Act
    note: Thresholds are on taxable income, after the personal allowance.

  bands_wales:
    label: Income tax bands, Wales
    unit: gbp_per_year
    bands:
      - { threshold: 0, rate: 0.20 }
      - { threshold: 37700, rate: 0.40 }
      - { threshold: 125140, rate: 0.45 }
    source: hmrc-employer-rates-2026-27
    legal: Income Tax Act 2007 s6B; Welsh rates set by the Senedd
    note: Same as England for 2026-27. Kept separate so the Senedd's rates can be changed on their own.

  bands_scotland:
    label: Income tax bands, Scotland
    unit: gbp_per_year
    bands:
      - { threshold: 0, rate: 0.19 }
      - { threshold: 3967, rate: 0.20 }
      - { threshold: 16956, rate: 0.21 }
      - { threshold: 31092, rate: 0.42 }
      - { threshold: 62430, rate: 0.45 }
      - { threshold: 125140, rate: 0.48 }
    source: hmrc-employer-rates-2026-27
    legal: Income Tax Act 2007 s6C and s11A; rates and bands set by the Scottish Rate Resolution
    note: Thresholds are on taxable income, after the personal allowance. With the full allowance, the higher rate starts at £43,663 of income and the advanced rate at £75,001. Applies to non-savings, non-dividend income only.

  savings_starting_rate_band:
    label: Starting rate for savings band (taxed at 0%)
    unit: gbp_per_year
    value: 5000
    source: govuk-savings-allowance
    legal: Income Tax Act 2007 s7 and s12
    note: Reduced £1 for each £1 of non-savings income above the personal allowance, so it's gone at £17,570 of other income.

  personal_savings_allowance_basic:
    label: Personal savings allowance, basic rate taxpayers
    unit: gbp_per_year
    value: 1000
    source: govuk-savings-allowance
    legal: Income Tax Act 2007 s12A and s12B

  personal_savings_allowance_higher:
    label: Personal savings allowance, higher rate taxpayers
    unit: gbp_per_year
    value: 500
    source: govuk-savings-allowance
    legal: Income Tax Act 2007 s12A and s12B

  personal_savings_allowance_additional:
    label: Personal savings allowance, additional rate taxpayers
    unit: gbp_per_year
    value: 0
    source: govuk-savings-allowance
    legal: Income Tax Act 2007 s12A and s12B

  dividend_allowance:
    label: Dividend allowance (taxed at 0%)
    unit: gbp_per_year
    value: 500
    source: govuk-dividend-tax
    legal: Income Tax Act 2007 s13A

  dividend_ordinary_rate:
    label: Dividend ordinary rate (basic rate band)
    unit: rate
    value: 0.1075
    source: govuk-dividend-tax
    legal: Income Tax Act 2007 s8, as amended for 2026-27 (Autumn Budget 2025)
    note: Up from 8.75% in April 2026.

  dividend_upper_rate:
    label: Dividend upper rate (higher rate band)
    unit: rate
    value: 0.3575
    source: govuk-dividend-tax
    legal: Income Tax Act 2007 s8, as amended for 2026-27 (Autumn Budget 2025)
    note: Up from 33.75% in April 2026.

  dividend_additional_rate:
    label: Dividend additional rate
    unit: rate
    value: 0.3935
    source: govuk-dividend-tax
    legal: Income Tax Act 2007 s8
