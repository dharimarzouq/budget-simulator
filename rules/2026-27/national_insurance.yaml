year: 2026-27
area: national_insurance
label: National Insurance contributions
limits:
  - Class 1 is really worked out per pay period. Here it is on an annual basis, which matches when pay is steady through the year.
  - Employer rates - the standard rate and the under-21 zero rate. Apprentice, veteran and freeport reliefs aren't modelled.
  - The Employment Allowance is per employer, so it can't be given to a household. Population totals take it off as one figure (HMRC tax relief statistics).
  - Ignores people over State Pension age, who pay no employee or Class 4 contributions; the engine handles that by age.
parameters:
  state_pension_age:
    label: State Pension age (no employee or self-employed National Insurance from here)
    unit: years
    value: 66
    source: govuk-state-pension-age
    legal: Pensions Act 1995 Schedule 4, as amended by the Pensions Act 2014 s26
    note: Rising from 66 to 67 for people born on or after 6 April 1960, a month at a time, between 2026 and 2028. Treated as 66 for the whole of 2026-27, which is slightly early for some people.

  class1_primary_threshold:
    label: Employee National Insurance starts at (primary threshold)
    unit: gbp_per_year
    value: 12570
    source: hmrc-employer-rates-2026-27
    legal: Social Security (Contributions) Regulations 2001 reg 10

  class1_upper_earnings_limit:
    label: Upper earnings limit
    unit: gbp_per_year
    value: 50270
    source: hmrc-employer-rates-2026-27
    legal: Social Security (Contributions) Regulations 2001 reg 10

  class1_lower_earnings_limit:
    label: Lower earnings limit (counts for State Pension, nothing paid)
    unit: gbp_per_year
    value: 6708
    source: hmrc-employer-rates-2026-27
    legal: Social Security Contributions and Benefits Act 1992 s5

  class1_main_rate:
    label: Employee rate between the primary threshold and upper earnings limit
    unit: rate
    value: 0.08
    source: hmrc-employer-rates-2026-27
    legal: Social Security Contributions and Benefits Act 1992 s8

  class1_additional_rate:
    label: Employee rate above the upper earnings limit
    unit: rate
    value: 0.02
    source: hmrc-employer-rates-2026-27
    legal: Social Security Contributions and Benefits Act 1992 s8

  class1_secondary_threshold:
    label: Employer National Insurance starts at (secondary threshold)
    unit: gbp_per_year
    value: 5000
    source: hmrc-employer-rates-2026-27
    legal: Social Security (Contributions) Regulations 2001 reg 10

  class1_secondary_rate:
    label: Employer rate above the secondary threshold
    unit: rate
    value: 0.15
    source: hmrc-employer-rates-2026-27
    legal: Social Security Contributions and Benefits Act 1992 s9

  class1_secondary_under21_upper_threshold:
    label: Employer National Insurance for employees under 21 starts above (upper secondary threshold)
    unit: gbp_per_year
    value: 50270
    source: hmrc-employer-rates-2026-27
    legal: Social Security Contributions and Benefits Act 1992 s9A
    note: Employers pay 0% on under-21s' pay up to this, then the normal rate. The same relief for apprentices under 25 isn't modelled, because the population doesn't say who is an apprentice. HMRC puts its cost at £0.57bn in 2025-26.

  employment_allowance:
    label: Employment Allowance (cut to each employer's yearly bill)
    unit: gbp_per_year
    value: 10500
    source: hmrc-employer-rates-2026-27
    legal: National Insurance Contributions Act 2014 s1
    note: Per employer, not per employee. Matters for costing employer NICs, not for a household's own income.

  employment_allowance_cost:
    label: Cost of the Employment Allowance, taken off population totals as one sum
    unit: gbp_per_year
    value: 7400000000
    source: hmrc-tax-reliefs-2026-01
    legal: National Insurance Contributions Act 2014 s1
    note: HMRC's 2025-26 cost estimate. Used because the allowance depends on the employer, not the household. If employer NICs rules change, this stays fixed, which is roughly right because most employers claim the full £10,500.

  apprentice_relief_cost:
    label: Cost of the employer zero rate for apprentices under 25, taken off population totals as one sum
    unit: gbp_per_year
    value: 570000000
    source: hmrc-tax-reliefs-2026-01
    legal: Social Security Contributions and Benefits Act 1992 s9B
    note: HMRC's 2025-26 cost estimate. The population doesn't say who is an apprentice.

  class4_lower_profits_limit:
    label: Self-employed National Insurance starts at (lower profits limit)
    unit: gbp_per_year
    value: 12570
    source: hmrc-nics-rates-allowances
    legal: Social Security Contributions and Benefits Act 1992 s15

  class4_upper_profits_limit:
    label: Upper profits limit
    unit: gbp_per_year
    value: 50270
    source: hmrc-nics-rates-allowances
    legal: Social Security Contributions and Benefits Act 1992 s15

  class4_main_rate:
    label: Self-employed rate between the profits limits
    unit: rate
    value: 0.06
    source: hmrc-nics-rates-allowances
    legal: Social Security Contributions and Benefits Act 1992 s15

  class4_additional_rate:
    label: Self-employed rate above the upper profits limit
    unit: rate
    value: 0.02
    source: hmrc-nics-rates-allowances
    legal: Social Security Contributions and Benefits Act 1992 s15

  class2_small_profits_threshold:
    label: Small profits threshold (Class 2 treated as paid above this)
    unit: gbp_per_year
    value: 7105
    source: hmrc-nics-rates-allowances
    legal: Social Security Contributions and Benefits Act 1992 s11
    note: Since April 2024 nobody has to pay Class 2. Above this threshold it counts as paid; below it, people can choose to pay.

  class2_voluntary_weekly_rate:
    label: Voluntary Class 2 rate
    unit: gbp_per_week
    value: 3.65
    source: hmrc-nics-rates-allowances
    legal: Social Security Contributions and Benefits Act 1992 s11
