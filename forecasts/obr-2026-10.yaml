forecast: obr-2026-10
label: OBR Economic and fiscal outlook, October 2026 (Budget 2026)
years: [2025-26, 2026-27, 2027-28, 2028-29, 2029-30, 2030-31, 2031-32]
limits:
  - The OBR's forecast includes the policies announced at Budget 2026 (28 October 2026), most of which start in April 2027. The simulator's rules are 2026-27's, so a budget is costed against 2026-27 rules and carried forward; it doesn't allow for how it would interact with those later changes.
  - 2025-26 is outturn; later years are forecasts.
