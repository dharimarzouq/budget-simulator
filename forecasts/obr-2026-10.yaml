fiscal_rules:
  target_year: 2029-30
  stability:
    label: Current budget in surplus in 2029-30 (the fiscal mandate)
    margin: 14.5
    source: obr-efo-2026-10
    table: Table 7.1
  debt:
    label: Debt (public sector net financial liabilities) falling as a share of GDP in 2029-30 (supplementary target)
    margin: 24.4
    source: obr-efo-2026-10
    table: Table 7.1
    note: "The margin is how much higher debt could be at end-March 2030 and still be falling as a share of GDP."
multipliers:
  label: Effect on real GDP of a fiscal change worth 1% of GDP, in % of GDP, by year since it starts
  tax: [0.33, 0.30, 0.23, 0.14, 0.05, 0.00]
  welfare: [0.60, 0.57, 0.43, 0.23, 0.07, 0.00]
  source: obr-fer-2026-06
  table: "Chapter 2, Table 2.1 (tax; AME, which includes welfare)"
  note: The OBR calls these a starting point that it adjusts at each forecast, and highly uncertain.
  range_low: 0.5
  range_high: 1.5
  range_note: A judgement, as for behavioural costings. The OBR doesn't publish a range.
cyclical_borrowing:
  label: Change in borrowing, in % of GDP, for each 1% of GDP the output gap changes, this year and last year
  this_year: 0.5
  last_year: 0.2
  source: obr-wp3-2012
  note: "The OBR's coefficients. With its output gaps they reproduce the cyclically adjusted borrowing in the October 2026 forecast (Table A.9) to within rounding."
