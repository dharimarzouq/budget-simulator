# Barnett formula (Statement of Funding Policy, June 2025, Annex A): change × comparability × population share × factor.
barnett:
  population_share: { scotland: 0.0952, wales: 0.0549, northern_ireland: 0.0333 }
  # Wales: 5% needs-based factor. Northern Ireland: 24% needs-based factor, and changes abated 2.5% for VAT.
  needs: { scotland: 1.0, wales: 1.05, northern_ireland: 1.24 }
  vat_abatement: { scotland: 1.0, wales: 1.0, northern_ireland: 0.975 }
