# Departmental spending plans and their Barnett comparability factors.
#
# rdel: day-to-day spending (resource DEL excluding depreciation), £bn, 2025-26 (outturn) to 2028-29. OBR, Economic and
#   fiscal outlook October 2026, detailed forecast tables, expenditure, Table 5.7.
# cdel: investment spending (capital DEL), £bn, 2025-26 (outturn) to 2029-30. Same, Table 5.8.
#   After the last year given, each department grows in line with the OBR's total (forecasts/obr-2026-10.yaml,
#   rdel_total and cdel_total): an assumption, as the government hasn't set departmental plans that far ahead.
# comparability: the share of the department's spending on services Scotland, Wales and Northern Ireland run themselves,
#   from HM Treasury's Statement of Funding Policy (June 2025), Annex B, used at Spending Review 2025. A change to the
#   department's budget changes their block grants by the Barnett formula (src/policy/spending.ts). Departments it
#   doesn't list (Defence, the Foreign Office, the intelligence agencies: reserved) are 0.
# Reserves and accounting provisions in the tables aren't departments and aren't included.
plan_sources: [obr-efo-2026-10]
comparability_source: hmt-statement-of-funding-policy-2025-06
departments:
